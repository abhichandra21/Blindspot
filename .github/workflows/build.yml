name: Build

# Every push and pull request: check that the app builds.
# A pushed tag like v0.2.0: also publish a GitHub release with Blindspot.zip.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job below can write.
permissions:
  contents: read

jobs:
  build:
    # Release ZIPs are built with this runner's Xcode 26.6 SDK. When bumping the
    # runner, bump the xcode-select line below to an Xcode it ships.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      # Tags only: every release is signed with the same certificate, so macOS
      # keeps the Screen Recording grant when someone updates.
      - name: Import release certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_CERT_P12: ${{ secrets.RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$RELEASE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$RELEASE_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm "$RUNNER_TEMP/release.p12"
          # codesign on the runner only finds identities in keychains on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=Blindspot Release Signing" >> "$GITHUB_ENV"

      - name: Build
        run: |
          # On a tag, v0.2.0 becomes version 0.2.0 in the app.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh
          codesign --verify --strict Blindspot.app
          # A different certificate would drop every user's grant, so check it is this one.
          if [[ -n "${SIGN_IDENTITY:-}" ]]; then
            codesign -d -r- Blindspot.app 2>&1 | grep -q 'certificate leaf = H"d413574c24136389717068907d77c9ccb1ebab41"' \
              || { echo "error: release is not signed with the release certificate" >&2; exit 1; }
          fi
          xcrun vtool -show-build Blindspot.app/Contents/MacOS/Blindspot

      - name: Zip
        # ditto keeps the app bundle intact, unlike plain zip.
        run: ditto -c -k --keepParent Blindspot.app Blindspot.zip

      - name: Keep the build for download from the run page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Blindspot
          path: Blindspot.zip

  release:
    # A separate job, because token permissions cannot be limited to one step.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Get the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Blindspot

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Blindspot.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Blindspot $GITHUB_REF_NAME" \
            --notes "Download Blindspot.zip below. This build is not signed by Apple, so macOS blocks the first launch. See [Install](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md) for the one-time steps."
